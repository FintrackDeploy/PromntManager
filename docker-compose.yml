services:
  web:
    build: .
    ports: ["127.0.0.1:8080:8080"]   # только локально; для публикации поставьте перед контейнером HTTPS-прокси
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
